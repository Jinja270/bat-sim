<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64' width='64' height='64'>
  <!-- Rotor blur / disc circles -->
  <circle cx='14' cy='14' r='11' fill='#00F0FF' fill-opacity='0.30' stroke='#38BDF8' stroke-width='1.5'/>
  <circle cx='50' cy='14' r='11' fill='#00F0FF' fill-opacity='0.30' stroke='#38BDF8' stroke-width='1.5'/>
  <circle cx='14' cy='50' r='11' fill='#00F0FF' fill-opacity='0.30' stroke='#38BDF8' stroke-width='1.5'/>
  <circle cx='50' cy='50' r='11' fill='#00F0FF' fill-opacity='0.30' stroke='#38BDF8' stroke-width='1.5'/>
  
  <!-- Spinning Rotor Blades -->
  <line x1='6' y1='14' x2='22' y2='14' stroke='#FFFFFF' stroke-width='2.2' stroke-linecap='round'/>
  <line x1='42' y1='14' x2='58' y2='14' stroke='#FFFFFF' stroke-width='2.2' stroke-linecap='round'/>
  <line x1='14' y1='42' x2='14' y2='58' stroke='#FFFFFF' stroke-width='2.2' stroke-linecap='round'/>
  <line x1='50' y1='42' x2='50' y2='58' stroke='#FFFFFF' stroke-width='2.2' stroke-linecap='round'/>
  
  <!-- Motor Hubs -->
  <circle cx='14' cy='14' r='3.5' fill='#0F172A' stroke='#00F0FF' stroke-width='1.5'/>
  <circle cx='50' cy='14' r='3.5' fill='#0F172A' stroke='#00F0FF' stroke-width='1.5'/>
  <circle cx='14' cy='50' r='3.5' fill='#0F172A' stroke='#00F0FF' stroke-width='1.5'/>
  <circle cx='50' cy='50' r='3.5' fill='#0F172A' stroke='#00F0FF' stroke-width='1.5'/>

  <!-- Carbon fiber X-frame arms -->
  <line x1='14' y1='14' x2='50' y2='50' stroke='#0F172A' stroke-width='5.5' stroke-linecap='round'/>
  <line x1='14' y1='50' x2='50' y2='14' stroke='#0F172A' stroke-width='5.5' stroke-linecap='round'/>
  <line x1='14' y1='14' x2='50' y2='50' stroke='#00F0FF' stroke-width='1.8' stroke-linecap='round'/>
  <line x1='14' y1='50' x2='50' y2='14' stroke='#00F0FF' stroke-width='1.8' stroke-linecap='round'/>

  <!-- Central Fuselage / Pod pointing +X -->
  <path d='M 45,32 C 41,23 23,22 18,25 C 14,28 14,36 18,39 C 23,42 41,41 45,32 Z' fill='#0B132B' stroke='#00F0FF' stroke-width='2'/>
  <path d='M 41,32 C 38,26 24,25 21,27 C 18,29 18,35 21,37 C 24,39 38,38 41,32 Z' fill='#1C2541'/>

  <!-- Front Optical Sensor / Echolocation Emitter (facing +X) -->
  <circle cx='42' cy='32' r='3.0' fill='#00F0FF'/>
  <circle cx='42' cy='32' r='1.2' fill='#FFFFFF'/>

  <!-- Front Green Navigation LEDs -->
  <circle cx='49' cy='19' r='2.2' fill='#10B981'/>
  <circle cx='49' cy='45' r='2.2' fill='#10B981'/>

  <!-- Rear Red Status LEDs -->
  <circle cx='15' cy='19' r='1.8' fill='#EF4444'/>
  <circle cx='15' cy='45' r='1.8' fill='#EF4444'/>
</svg>